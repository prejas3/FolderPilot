[package]
name = "folderpilot"
version = "0.1.0"
description = "Automatic file organiser"
authors = ["Szymon Jankiewicz"]
license = "MIT"
edition = "2021"

[lib]
name = "folderpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
dirs = "7"
glob = "0.3"
kamadak-exif = "0.6"
notify = "8.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
